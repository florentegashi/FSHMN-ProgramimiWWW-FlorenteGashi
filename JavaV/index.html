<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistro misionin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <h1>Regjistro misionin</h1>

    <hr>

    <p class="intro">
        Demonstrim lokal: përdor vetëm të dhëna të sajuara.
        Nuk kryhet regjistrim real.
    </p>

    <form action="pranuar.html" method="get">

        <div class="field">
            <label for="pseudonimi">
                Pseudonimi (3–20 karaktere)
            </label>

            <input
                type="text"
                id="pseudonimi"
                name="pseudonimi"
                minlength="3"
                maxlength="20"
                required
            >
        </div>

        <div class="field">
            <label for="email">
                Email i sajuar
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="student@example.org"
                required
            >
        </div>

        <div class="field">
            <label for="persona">
                Persona (1–5)
            </label>

            <input
                type="number"
                id="persona"
                name="persona"
                min="1"
                max="5"
                required
            >
        </div>

        <fieldset>

            <legend>Kategoria</legend>

            <label class="radio-label">
                <input
                    type="radio"
                    name="kategoria"
                    value="Art"
                    required
                >
                Art
            </label>

            <label class="radio-label">
                <input
                    type="radio"
                    name="kategoria"
                    value="Shkencë"
                >
                Shkencë
            </label>

        </fieldset>

        <div class="rules">

            <label for="rregullat">

                <input
                    type="checkbox"
                    id="rregullat"
                    name="rregullat"
                    value="pranuar"
                    required
                >

                I pranoj rregullat e demonstrimit

            </label>

        </div>

        <button type="submit">
            Kontrollo formularin
        </button>

    </form>


    <table>

        <caption>
            Oraret e misioneve
        </caption>

        <thead>

            <tr>
                <th scope="col">Ora</th>
                <th scope="col">Misioni</th>
                <th scope="col">Vendi</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>10:00</td>
                <td>Gjej shenjën</td>
                <td>Oborri</td>
            </tr>

            <tr>
                <td>12:00</td>
                <td>Lexo hartën</td>
                <td>Biblioteka</td>
            </tr>

            <tr>
                <td>14:00</td>
                <td>Zbulo objektin</td>
                <td>Laboratori</td>
            </tr>

        </tbody>

    </table>

</main>

</body>
</html>
